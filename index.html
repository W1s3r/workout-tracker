<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Our Workouts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #0f0f0f; color: #e8e8e8;
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px; gap: 16px;
  }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  p { color: #999; font-size: 14px; margin-bottom: 24px; }
  a {
    display: block; width: 260px; padding: 20px; border-radius: 16px;
    text-decoration: none; text-align: center; font-size: 18px; font-weight: 600;
    transition: transform 0.15s;
  }
  a:active { transform: scale(0.97); }
  .her { background: rgba(192,132,252,0.15); color: #c084fc; border: 2px solid rgba(192,132,252,0.3); }
  .his { background: rgba(96,165,250,0.15); color: #60a5fa; border: 2px solid rgba(96,165,250,0.3); }
  .sub { font-size: 13px; opacity: 0.7; margin-top: 4px; font-weight: 400; }
</style>
</head>
<body>
  <h1>Our Workouts</h1>
  <p>Pick your workout to get started</p>
  <a href="her.html" class="her">Her Workout<div class="sub">Glutes, Hamstrings, Core & Tone</div></a>
  <a href="his.html" class="his">His Workout<div class="sub">Chest, Shoulders, Back & Arms</div></a>
</body>
</html>
